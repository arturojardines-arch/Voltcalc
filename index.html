<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIJG Calculadora de Caída de Voltaje</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos personalizados para el fondo y efectos de cristal */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-input:focus {
      border-color: #f59e0b;
      outline: none;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="glass-panel border-b border-slate-700/50 py-4 px-6 shadow-2xl sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold text-xl shadow-lg shadow-amber-500/20">⚡</div>
        <h1 class="text-xl font-bold tracking-wide text-white">VoltCalc <span class="text-amber-400">Pro</span></h1>
      </div>
      <span class="text-xs bg-slate-800/80 text-amber-300 px-3 py-1 rounded-full border border-amber-500/30 font-medium">
        Norma NEC / NOM-001
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-6xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Formulario de Entrada (Izquierda) -->
    <div class="lg:col-span-5 glass-panel rounded-2xl p-5 shadow-2xl space-y-4">
      <h2 class="text-lg font-semibold text-amber-400 border-b border-slate-700/60 pb-2 flex items-center justify-between">
        <span>Parámetros del Circuito</span>
        <span class="text-xs text-slate-400 font-normal">Paso 1 de 2</span>
      </h2>

      <!-- Sistema de Fases -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Sistema Eléctrico</label>
        <select id="phaseSystem" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
          <option value="1ph2w" class="bg-slate-900">Monofásico (1F + N / 120V - 240V)</option>
          <option value="3ph3w" class="bg-slate-900">Trifásico (3F / 208V - 480V)</option>
        </select>
      </div>

      <!-- Voltaje y Corriente -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Voltaje Nominal (V)</label>
          <input type="number" id="voltage" value="120" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Corriente (A)</label>
          <input type="number" id="current" value="20" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
        </div>
      </div>

      <!-- Distancia y Unidades -->
      <div class="grid grid-cols-3 gap-2">
        <div class="col-span-2">
          <label class="block text-xs font-medium text-slate-300 mb-1">Distancia de Línea</label>
          <input type="number" id="distance" value="30" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Unidad</label>
          <select id="distanceUnit" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
            <option value="m" class="bg-slate-900">Metros</option>
            <option value="ft" class="bg-slate-900">Pies</option>
          </select>
        </div>
      </div>

      <!-- Material y Canalización -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Material Conductor</label>
          <select id="conductorMaterial" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
            <option value="cu" class="bg-slate-900">Cobre (Cu)</option>
            <option value="al" class="bg-slate-900">Aluminio (Al)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Canalización (Conduit)</label>
          <select id="conduitType" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
            <option value="pvc" class="bg-slate-900">PVC / No Metálico</option>
            <option value="steel" class="bg-slate-900">Acero / Metálico</option>
          </select>
        </div>
      </div>

      <!-- Calibre del Cable y Límite de %VD -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Calibre Seleccionado</label>
          <select id="wireGauge" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
            <option value="auto" class="bg-slate-900">Auto-seleccionar</option>
            <option value="14" class="bg-slate-900">14 AWG</option>
            <option value="12" selected class="bg-slate-900">12 AWG</option>
            <option value="10" class="bg-slate-900">10 AWG</option>
            <option value="8" class="bg-slate-900">8 AWG</option>
            <option value="6" class="bg-slate-900">6 AWG</option>
            <option value="4" class="bg-slate-900">4 AWG</option>
            <option value="2" class="bg-slate-900">2 AWG</option>
            <option value="1/0" class="bg-slate-900">1/0 AWG</option>
            <option value="2/0" class="bg-slate-900">2/0 AWG</option>
            <option value="4/0" class="bg-slate-900">4/0 AWG</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Límite Máx. %VD</label>
          <select id="maxVdPercent" class="w-full glass-input rounded-xl p-2.5 text-sm text-white transition">
            <option value="3" class="bg-slate-900">3% (Circuito Derivado)</option>
            <option value="5" class="bg-slate-900">5% (Alimentador + Derivado)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Resultados y Gráficos (Derecha) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- Tarjetas de Resultados Principales -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass-panel rounded-2xl p-4 shadow-xl text-center hover:border-amber-500/50 transition">
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Caída de Voltaje</span>
          <div id="resVdVolts" class="text-2xl font-bold text-amber-400 mt-1">0.00 V</div>
          <span class="text-xs text-slate-400">Pérdida en la línea</span>
        </div>

        <div class="glass-panel rounded-2xl p-4 shadow-xl text-center hover:border-emerald-500/50 transition">
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Porcentaje Caída</span>
          <div id="resVdPercent" class="text-2xl font-bold text-emerald-400 mt-1">0.00%</div>
          <span id="resVdStatus" class="text-xs text-emerald-400">Dentro de norma</span>
        </div>

        <div class="glass-panel rounded-2xl p-4 shadow-xl text-center hover:border-blue-500/50 transition">
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Voltaje en la Carga</span>
          <div id="resLoadVoltage" class="text-2xl font-bold text-blue-400 mt-1">0.00 V</div>
          <span class="text-xs text-slate-400">Tensión disponible</span>
        </div>
      </div>

      <!-- Esquema del Circuito Visual con Fondo Estilizado -->
      <div class="glass-panel rounded-2xl p-5 shadow-2xl space-y-3">
        <h3 class="text-sm font-semibold text-slate-200 flex items-center space-x-2">
          <span>Esquema Dinámico del Circuito</span>
        </h3>
        <div class="flex items-center justify-between bg-slate-950/70 p-5 rounded-xl border border-slate-700/50 text-xs shadow-inner">
          <div class="text-center">
            <div class="w-12 h-12 bg-amber-500/20 text-amber-400 border border-amber-500/50 rounded-2xl flex items-center justify-center font-bold mx-auto mb-1 shadow-lg shadow-amber-500/10">Fuente</div>
            <span id="schSourceV" class="block font-semibold text-slate-100 text-sm">120.0 V</span>
          </div>

          <div class="flex-grow mx-6 relative">
            <div class="h-2 bg-gradient-to-r from-amber-500 to-blue-500 rounded-full shadow-md"></div>
            <div class="text-center mt-2 text-[11px] text-slate-300">
              <span id="schGauge" class="font-semibold text-amber-300">12 AWG Cu</span> — <span id="schDist" class="text-slate-200">30 m</span>
            </div>
          </div>

          <div class="text-center">
            <div class="w-12 h-12 bg-blue-500/20 text-blue-400 border border-blue-500/50 rounded-2xl flex items-center justify-center font-bold mx-auto mb-1 shadow-lg shadow-blue-500/10">Carga</div>
            <span id="schLoadV" class="block font-semibold text-slate-100 text-sm">118.2 V</span>
          </div>
        </div>
      </div>

      <!-- Botón para copiar reporte -->
      <button onclick="copyReport()" class="w-full glass-panel hover:bg-slate-800/80 text-amber-400 border border-amber-500/40 py-3 rounded-2xl font-semibold text-sm transition-all shadow-xl flex items-center justify-center space-x-2 hover:scale-[1.01] active:scale-[0.99]">
        <span>📋 Copiar Reporte de Ingeniería</span>
      </button>

    </div>
  </main>

  <script>
    const necTable = {
      'cu': {
        '14': 10.1, '12': 6.36, '10': 3.99, '8': 2.52, '6': 1.61,
        '4': 1.02, '2': 0.64, '1/0': 0.39, '2/0': 0.31, '4/0': 0.196
      },
      'al': {
        '14': 16.5, '12': 10.5, '10': 6.56, '8': 4.13, '6': 2.62,
        '4': 1.64, '2': 1.05, '1/0': 0.64, '2/0': 0.51, '4/0': 0.32
      }
    };

    function calculate() {
      const system = document.getElementById('phaseSystem').value;
      const V = parseFloat(document.getElementById('voltage').value) || 120;
      const I = parseFloat(document.getElementById('current').value) || 0;
      let dist = parseFloat(document.getElementById('distance').value) || 0;
      const unit = document.getElementById('distanceUnit').value;
      const mat = document.getElementById('conductorMaterial').value;
      let gauge = document.getElementById('wireGauge').value;
      const maxVd = parseFloat(document.getElementById('maxVdPercent').value);

      const distMeters = unit === 'ft' ? dist * 0.3048 : dist;
      const phaseFactor = system === '3ph3w' ? 1.732 : 2.0;

      if (gauge === 'auto') {
        const gauges = ['14', '12', '10', '8', '6', '4', '2', '1/0', '2/0', '4/0'];
        gauge = '14';
        for (let g of gauges) {
          const r = necTable[mat][g] || 10;
          const vd = (phaseFactor * distMeters * I * (r / 1000));
          if ((vd / V) * 100 <= maxVd) {
            gauge = g;
            break;
          }
        }
      }

      const R = necTable[mat][gauge] || 6.36;
      const dropV = (phaseFactor * distMeters * I * (R / 1000));
      const percentVd = (dropV / V) * 100;
      const loadV = V - dropV;

      document.getElementById('resVdVolts').innerText = dropV.toFixed(2) + ' V';
      document.getElementById('resVdPercent').innerText = percentVd.toFixed(2) + '%';
      document.getElementById('resLoadVoltage').innerText = loadV.toFixed(2) + ' V';

      const statusEl = document.getElementById('resVdStatus');
      if (percentVd <= maxVd) {
        statusEl.innerText = 'Dentro de norma (≤ ' + maxVd + '%)';
        statusEl.className = 'text-xs text-emerald-400 font-medium';
      } else {
        statusEl.innerText = 'Excede la norma (> ' + maxVd + '%)';
        statusEl.className = 'text-xs text-rose-400 font-bold';
      }

      document.getElementById('schSourceV').innerText = V.toFixed(1) + ' V';
      document.getElementById('schLoadV').innerText = loadV.toFixed(1) + ' V';
      document.getElementById('schGauge').innerText = gauge + ' AWG ' + mat.toUpperCase();
      document.getElementById('schDist').innerText = dist + ' ' + unit;
    }

    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', calculate);
    });

    function copyReport() {
      const report = `--- REPORTE DE CÁLCULO ELÉCTRICO ---
Voltaje Fuente: ${document.getElementById('schSourceV').innerText}
Voltaje Carga: ${document.getElementById('schLoadV').innerText}
Caída de Voltaje: ${document.getElementById('resVdVolts').innerText} (${document.getElementById('resVdPercent').innerText})
Calibre Conductor: ${document.getElementById('schGauge').innerText}
Distancia: ${document.getElementById('schDist').innerText}
Estado: ${document.getElementById('resVdStatus').innerText}`;

      navigator.clipboard.writeText(report);
      alert('Reporte copiado al portapapeles.');
    }

    calculate();
  </script>
</body>
</html>
